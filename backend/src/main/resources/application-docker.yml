spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/smarteventbar
    username: smarteventbar
    password: smarteventbar

  devtools:
    restart:
      enabled: true
      poll-interval: 2s
      quiet-period: 1s

# In Docker, allow WebSocket connections from the frontend container
websocket:
  allowed-origins: "http://localhost:5173,http://frontend:5173"
