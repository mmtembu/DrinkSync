spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///smarteventbar
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: smart-event-bar-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration-hours: 12
