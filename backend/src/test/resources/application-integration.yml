spring:
  datasource:
    # Integration test profile using PostgreSQL.
    # Requires a running PostgreSQL instance. Start one with:
    #   docker run -d --name test-postgres -e POSTGRES_DB=smarteventbar \
    #     -e POSTGRES_USER=smarteventbar -e POSTGRES_PASSWORD=smarteventbar \
    #     -p 5433:5432 postgres:16-alpine
    #
    # Alternatively, if Testcontainers is compatible with your Docker version,
    # use the "test" profile which uses Testcontainers JDBC URL.
    url: jdbc:postgresql://localhost:5433/smarteventbar
    username: smarteventbar
    password: smarteventbar
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: smart-event-bar-jwt-secret-key-that-is-at-least-256-bits-long-for-hs256
  expiration-hours: 12
