# WARNING: Replace base64 values before applying!
# Generate base64: echo -n 'your-value' | base64
#
# Example:
#   echo -n 'my-secure-password' | base64
#   => bXktc2VjdXJlLXBhc3N3b3Jk
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: drinksync
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: drinksync
type: Opaque
data:
  # echo -n 'smarteventbar' | base64
  POSTGRES_DB: c21hcnRldmVudGJhcg==
  # echo -n 'smarteventbar' | base64
  POSTGRES_USER: c21hcnRldmVudGJhcg==
  # echo -n 'change-me-in-production' | base64
  POSTGRES_PASSWORD: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
---
apiVersion: v1
kind: Secret
metadata:
  name: app-secret
  namespace: drinksync
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: drinksync
type: Opaque
data:
  # echo -n 'smarteventbar' | base64
  SPRING_DATASOURCE_USERNAME: c21hcnRldmVudGJhcg==
  # echo -n 'change-me-in-production' | base64
  SPRING_DATASOURCE_PASSWORD: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
  # echo -n 'change-me-generate-a-secure-256-bit-key' | base64
  JWT_SECRET: Y2hhbmdlLW1lLWdlbmVyYXRlLWEtc2VjdXJlLTI1Ni1iaXQta2V5
---
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: drinksync
  labels:
    app.kubernetes.io/part-of: drinksync
type: kubernetes.io/dockerconfigjson
data:
  # Generate with:
  #   echo -n '{"auths":{"ghcr.io":{"username":"mmtembu","password":"YOUR_GITHUB_PAT"}}}' | base64
  .dockerconfigjson: REPLACE_WITH_BASE64_ENCODED_DOCKER_CONFIG_JSON
